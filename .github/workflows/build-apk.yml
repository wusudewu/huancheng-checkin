name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Copy Python source
        run: |
          mkdir -p app/src/main/python/static
          cp ../hcnsec_auto_checkin.py app/src/main/python/
          cp ../web_app.py app/src/main/python/
          cp ../accounts.json app/src/main/python/
          cp -r ../static/* app/src/main/python/static/

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 幻城签到-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
