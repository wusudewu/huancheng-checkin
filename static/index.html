<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幻城 · 签到中枢</title>
<script src="/static/js/react.production.min.js"></script>

<style>
/* ======================== DESIGN TOKENS ======================== */
:root {
    --primary: #19c8b9;
    --primary-hover: #3dd4c6;
    --primary-active: #11a89b;
    --primary-bg: #e6f9f6;
    --text: #794f27;
    --text-body: #725d42;
    --text-secondary: #9f927d;
    --text-muted: #8a7b66;
    --text-disabled: #c4b89e;
    --bg: #f8f8f0;
    --bg-content: rgb(247, 243, 223);
    --bg-disabled: #f0ece2;
    --border: #c4b89e;
    --border-hover: #a89878;
    --border-strong: #9f927d;
    --success: #6fba2c;
    --success-active: #5a9e1e;
    --warning: #f5c31c;
    --warning-active: #dba90e;
    --error: #e05a5a;
    --error-active: #c94444;
    --focus-yellow: #ffcc00;
    --focus-yellow-d: #e0b800;
    --shadow-btn: #bdaea0;
    --shadow-input: #d4c9b4;
    --r-sm: 12px;
    --r-base: 18px;
    --r-lg: 24px;
    --r-pill: 50px;
    --ease: cubic-bezier(0.4, 0, 0.2, 1);
    --d-fast: 0.15s;
    --d-base: 0.25s;
    --d-slow: 0.35s;
}

/* ======================== RESET & BASE ======================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; }
body {
    font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
    font-weight: 500;
    letter-spacing: 0.01em;
    color: var(--text-body);
    background: var(--bg);
    min-height: 100vh;
    overflow-x: hidden;
}

/* ======================== PAGE LAYOUT ======================== */
.page {
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 24px 48px;
    position: relative;
    z-index: 1;
}

/* Hero */
.hero-section {
    text-align: center;
    margin-bottom: 28px;
}
.hero-subtitle {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-muted);
    margin-top: 12px;
    letter-spacing: 0.02em;
}

/* Stats row */
.stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 24px;
}
@media (max-width: 720px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
}
.stat-card-inner {
    text-align: center;
    padding: 4px 0;
}
.stat-icon-text {
    font-size: 28px;
    margin-bottom: 6px;
    display: block;
}
.stat-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
}
.stat-value {
    font-size: 26px;
    font-weight: 800;
    color: var(--text);
    line-height: 1.2;
    font-variant-numeric: tabular-nums;
}
.stat-unit {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
}

/* Action bar */
.action-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 20px;
}

/* Progress area */
.progress-area {
    margin-bottom: 20px;
}
.progress-meta-row {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
}
.result-list {
    list-style: none;
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
}

/* Dual layout */
.dual-layout {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 24px;
}
@media (max-width: 720px) {
    .dual-layout { grid-template-columns: 1fr; }
}

/* Account list */
.account-list-wrap { min-height: 200px; }
.account-item-row {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    border-radius: 14px;
    cursor: pointer;
    user-select: none;
    transition: background var(--d-fast) var(--ease);
    gap: 10px;
    margin-bottom: 4px;
}
.account-item-row:hover { background: rgba(25,200,185,0.08); }
.account-item-row.active { background: rgba(25,200,185,0.15); }
.ac-avatar-circle {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700;
    font-size: 15px;
    flex-shrink: 0;
}
.ac-name-text {
    flex: 1;
    font-weight: 600;
    color: var(--text);
    font-size: 14px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}
.ac-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
}
.ac-dot.online-checked { background: var(--success); }
.ac-dot.online-unchecked { background: var(--warning); }
.ac-dot.offline { background: var(--text-disabled); }
.ac-delete-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: transparent;
    color: var(--text-muted);
    border: none;
    cursor: pointer;
    font-size: 18px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all var(--d-fast) var(--ease);
}
.ac-delete-btn:hover { background: rgba(224,90,90,0.12); color: var(--error); }

/* Detail panel */
.detail-panel-wrap { min-height: 200px; }
.detail-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
}
.detail-avatar-lg {
    width: 52px; height: 52px;
    border-radius: 50%;
    background: var(--primary);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800;
    font-size: 22px;
    flex-shrink: 0;
}
.detail-name {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    flex: 1;
}
.data-grid-2x2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
}
.data-cell {
    background: rgba(248,248,240,0.7);
    padding: 10px 12px;
    border-radius: var(--r-sm);
}
.data-cell-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.03em;
    white-space: nowrap;
}
.data-cell-val {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    margin-top: 2px;
}
.quota-bar-wrap {
    height: 8px;
    background: var(--bg-disabled);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 6px;
}
.quota-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--primary-hover));
    border-radius: 999px;
    transition: width 0.6s var(--ease);
}
.section-label-sm {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin-bottom: 6px;
}

/* Add form */
.add-form-wrap {
    display: flex;
    gap: 12px;
    align-items: flex-end;
    margin-bottom: 24px;
    flex-wrap: wrap;
}
.field-col { flex: 1; min-width: 140px; }

/* Log terminal */
.log-terminal {
    background: #1e1810;
    border-radius: 16px;
    padding: 16px 20px;
    max-height: 320px;
    overflow-y: auto;
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace;
    font-size: 13px;
    line-height: 1.7;
    color: #e8d5bc;
    position: relative;
}
.log-scanline {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: rgba(25,200,185,0.08);
    pointer-events: none;
}
.log-line { display: block; white-space: pre-wrap; word-break: break-all; }
.ts { color: #6b5e50; }
.lvl-OK { color: #8ac68a; font-weight: 700; }
.lvl-INFO { color: #82d5bb; font-weight: 700; }
.lvl-WARN { color: #f7cd67; font-weight: 700; }
.lvl-ERR { color: #fc736d; font-weight: 700; }
.log-head-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
}
.log-title-text {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
}
.log-controls {
    display: flex;
    align-items: center;
    gap: 10px;
}

/* Footer */
.page-footer {
    text-align: center;
    padding: 24px 0 8px;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.02em;
}
.page-footer a {
    color: var(--primary-active);
    text-decoration: none;
    font-weight: 600;
}

/* Empty state */
.empty-state-wrap {
    text-align: center;
    padding: 40px 20px;
    color: var(--text-muted);
}
.empty-state-wrap .big-icon { font-size: 40px; display: block; margin-bottom: 10px; opacity: 0.5; }
.empty-state-wrap p { font-size: 14px; }

/* Notification overrides for dark terminal */
#notif-root {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    pointer-events: none;
    z-index: 2000;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 24px;
    gap: 12px;
}
</style>
</head>

<script type="text/babel" data-presets="react,typescript">

const { useState, useEffect, useRef, useCallback, createElement: h, Fragment } = React;

// ==================== UTILS ====================
const NUM_RE = /[\d.]+/;
const LOG_LINE_RE = /^(\[[^\]]+\])\s+\[(OK|INFO|WARN|ERR)\s*\]\s+(.*)$/;

function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

// ==================== API ====================
async function api(path, opts) {
    const res = await fetch(path, opts);
    let data = null;
    try { data = await res.json(); } catch(e) {}
    if (!res.ok) throw new Error((data && data.message) || `请求失败 (${res.status})`);
    return data;
}

// ==================== NOTIFICATION (vanilla DOM) ====================
let notifId = 0;

const NOTIF_ICONS = { success: '✓', info: 'ℹ', warning: '!', error: '✕' };
const NOTIF_COLORS = {
    success: { border: '#6fba2c', shadow: 'rgba(111,186,44,0.18)', bg: '#e9f6d4', icon: '#5a9e1e' },
    info:    { border: '#19c8b9', shadow: 'rgba(25,200,185,0.18)', bg: '#e6f9f6', icon: '#11a89b' },
    warning: { border: '#f5c31c', shadow: 'rgba(245,195,28,0.20)', bg: '#fdf3c4', icon: '#b88a06' },
    error:   { border: '#e05a5a', shadow: 'rgba(224,90,90,0.18)', bg: '#fbe0e0', icon: '#c94444' },
};

function showNotification({ message, description, type, duration, onClose }) {
    type = type || 'info';
    duration = duration !== undefined ? duration : 3.5;
    const tc = NOTIF_COLORS[type] || NOTIF_COLORS.info;
    const wrap = document.createElement('div');
    wrap.style.cssText = [
        'width:384px;max-width:calc(100vw-48px);padding:14px 16px',
        `background:rgb(247,243,223);border:2px solid ${tc.border};border-radius:18px`,
        `box-shadow:0 6px 18px ${tc.shadow};display:flex;align-items:flex-start;gap:12px`,
        'animation:notifSlideDown 0.25s cubic-bezier(0.4,0,0.2,1) both',
        'pointer-events:auto',
    ].join(';');

    const icon = document.createElement('div');
    icon.style.cssText = `width:32px;height:32px;border-radius:50%;background:${tc.bg};color:${tc.icon};display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0;user-select:none`;
    icon.textContent = NOTIF_ICONS[type];

    const body = document.createElement('div');
    body.style.cssText = 'flex:1 1 auto;min-width:0';

    const title = document.createElement('div');
    title.style.cssText = 'font-size:15px;font-weight:700;color:#794f27;letter-spacing:0.01em;word-break:break-word';
    title.textContent = message;

    body.appendChild(title);
    if (description) {
        const desc = document.createElement('div');
        desc.style.cssText = 'font-size:13px;font-weight:500;color:#8a7b66;line-height:1.55;margin-top:4px;word-break:break-word';
        desc.textContent = description;
        body.appendChild(desc);
    }

    const closeBtn = document.createElement('button');
    closeBtn.style.cssText = 'width:22px;height:22px;border-radius:50%;background:transparent;border:none;color:rgba(114,93,66,0.55);font-size:18px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center';
    closeBtn.textContent = '×';

    wrap.appendChild(icon);
    wrap.appendChild(body);
    wrap.appendChild(closeBtn);

    const container = document.getElementById('notif-root');
    container.appendChild(wrap);

    let timer = null, closed = false;
    function remove() {
        if (closed) return;
        closed = true;
        clearTimeout(timer);
        wrap.style.animation = 'notifSlideUp 0.25s cubic-bezier(0.4,0,0.2,1) both';
        setTimeout(() => {
            if (wrap.parentNode) wrap.parentNode.removeChild(wrap);
            if (onClose) onClose();
        }, 260);
    }

    if (duration > 0) timer = setTimeout(remove, duration * 1000);
    closeBtn.onclick = remove;
}

const Notification = {
    open(config) {
        const cfg = typeof config === 'string' ? { message: config } : config;
        showNotification(cfg);
    },
    success(msg, desc) { showNotification({ message: msg, description: desc, type: 'success' }); },
    info(msg, desc) { showNotification({ message: msg, description: desc, type: 'info' }); },
    warning(msg, desc) { showNotification({ message: msg, description: desc, type: 'warning' }); },
    error(msg, desc) { showNotification({ message: msg, description: desc, type: 'error' }); },
    destroy() {} // no-op for vanilla DOM
};

// ==================== BUTTON COMPONENT ====================
function Button({ type = 'default', size = 'middle', loading, disabled, ghost, block, children, onClick, style: extraStyle, ...rest }) {
    const sizeMap = {
        small:  { h: 32, px: 16, fs: 12, r: 16 },
        middle: { h: 45, px: 20, fs: 14, r: 50 },
        large:  { h: 48, px: 32, fs: 16, r: 24 },
    };
    const s = sizeMap[size] || sizeMap.middle;
    const isPrimary = type === 'primary';
    const isDanger = type === 'danger';

    const isDisabled = disabled || loading;

    let bg, color, border, shadow;
    if (isPrimary && isDanger) {
        bg = '#e05a5a'; color = '#fff'; border = '#e05a5a';
        shadow = '0 5px 0 0 #c94444';
    } else if (isPrimary) {
        bg = '#f8f8f0'; color = '#794f27'; border = '#f8f8f0';
        shadow = '0 5px 0 0 #bdaea0';
    } else if (type === 'dashed') {
        bg = '#f8f8f0'; color = '#725d42'; border = '2px dashed #9f927d'; shadow = '0 2px 4px 0 rgba(61,52,40,0.06)';
    } else {
        bg = '#f8f8f0'; color = '#725d42'; border = '2px solid #9f927d'; shadow = '0 2px 4px 0 rgba(61,52,40,0.06)';
    }

    if (ghost) { bg = 'transparent'; shadow = 'none'; }
    if (loading) {
        bg = '#0ec4b6';
        border = '4px solid #4de2da';
        color = '#fff';
        shadow = 'none';
    }

    const [hover, setHover] = useState(false);
    const [active, setActive] = useState(false);

    // Dynamic hover/active overrides for non-primary types
    let dynColor = color, dynBorder = border, dynShadow = shadow, dynBg = bg;
    if (!isDisabled && !loading && !ghost) {
        if (isPrimary && !isDanger) {
            if (active) dynShadow = '0 1px 0 0 #bdaea0';
            else if (hover) dynShadow = '0 6px 0 0 #bdaea0';
        } else if (isPrimary && isDanger) {
            if (active) dynShadow = '0 1px 0 0 #c94444';
            else if (hover) dynShadow = '0 6px 0 0 #c94444';
        } else {
            // default / dashed
            if (active) {
                dynColor = '#11a89b';
                dynBorder = type === 'dashed' ? '2px dashed #11a89b' : '2px solid #11a89b';
                dynShadow = '0 2px 4px 0 rgba(61,52,40,0.06)';
            } else if (hover) {
                dynColor = '#19c8b9';
                dynBorder = type === 'dashed' ? '2px dashed #19c8b9' : '2px solid #19c8b9';
                dynShadow = '0 3px 10px 0 rgba(61,52,40,0.10)';
            }
        }
    }

    const computedStyle = {
        display: ghost ? 'inline-flex' : (block ? 'flex' : 'inline-flex'),
        width: block ? '100%' : undefined,
        alignItems: 'center', justifyContent: 'center', gap: 6,
        height: s.h, padding: `0 ${s.px}px`,
        fontSize: s.fs, fontWeight: 600,
        letterSpacing: '0.02em', lineHeight: '1',
        borderRadius: s.r,
        background: loading ? undefined : dynBg,
        backgroundImage: loading
            ? 'repeating-linear-gradient(-45deg, #0ec4b6 0 10px, #01b0a7 10px 20px)'
            : undefined,
        backgroundSize: loading ? '28.28px 28.28px' : undefined,
        color: dynColor, border: dynBorder,
        boxShadow: loading ? 'none' : dynShadow,
        cursor: isDisabled ? 'not-allowed' : 'pointer',
        opacity: isDisabled && !loading ? 0.5 : 1,
        transform: active ? 'translateY(2px)' : hover ? 'translateY(-1px)' : 'translateY(0)',
        transition: 'all 0.15s cubic-bezier(0.4,0,0.2,1)',
        outline: 'none',
        ...(loading ? { animation: 'btnStripe 1s linear infinite' } : {}),
        ...extraStyle,
    };

    return h('button', {
        onClick: isDisabled ? undefined : onClick,
        disabled: isDisabled,
        style: computedStyle,
        onMouseEnter: () => setHover(true),
        onMouseLeave: () => { setHover(false); setActive(false); },
        onMouseDown: () => setActive(true),
        onMouseUp: () => setActive(false),
        ...rest,
    }, loading ? null : children);
}

// ==================== INPUT COMPONENT ====================
function Input({ value, onChange, placeholder, type: inputType, size = 'middle', style: extraStyle, ...rest }) {
    const sizeMap = { small: { h: 32, px: 14, fs: 12 }, middle: { h: 40, px: 18, fs: 14 }, large: { h: 48, px: 22, fs: 16 } };
    const s = sizeMap[size] || sizeMap.middle;
    const [focused, setFocused] = useState(false);

    return h('input', {
        type: inputType || 'text',
        value, onChange,
        placeholder,
        onFocus: () => setFocused(true),
        onBlur: () => setFocused(false),
        style: {
            width: '100%',
            height: s.h, padding: `0 ${s.px}px`,
            fontSize: s.fs, fontWeight: 500,
            letterSpacing: '0.01em',
            background: 'rgb(247,243,223)',
            border: focused ? '2px solid #ffcc00' : '2px solid #c4b89e',
            borderRadius: 50,
            color: '#725d42',
            outline: 'none',
            boxShadow: focused ? '0 0 0 3px rgba(255,204,0,0.15)' : 'none',
            transition: 'all 0.15s cubic-bezier(0.4,0,0.2,1)',
            fontFamily: 'inherit',
            ...(extraStyle || {}),
        },
        ...rest,
    });
}

// ==================== CARD COMPONENT ====================
const CARD_COLORS = {
    'default':      { bg: 'rgb(247,243,223)', text: '#725d42', border: '#e8dcc8', dot: 'rgba(114,93,66,0.12)', dot2: 'rgba(114,93,66,0.06)', bgSolid: '#f7f3df', textDark: '#725d42' },
    'app-teal':     { bg: '#e4f7f3', text: '#3d6b5e', border: '#82d5bb', dot: 'rgba(130,213,187,0.18)', dot2: 'rgba(130,213,187,0.10)', bgSolid: '#dff7f1', textDark: '#3d6b5e' },
    'app-green':    { bg: '#e6f3e3', text: '#3d6b3d', border: '#8ac68a', dot: 'rgba(138,198,138,0.18)', dot2: 'rgba(138,198,138,0.10)', bgSolid: '#e0f4e0', textDark: '#3d6b3d' },
    'app-yellow':   { bg: '#fdf5e0', text: '#725d42', border: '#f7cd67', dot: 'rgba(247,205,103,0.20)', dot2: 'rgba(247,205,103,0.12)', bgSolid: '#fdf2d0', textDark: '#725d42' },
    'app-pink':     { bg: '#fde4e8', text: '#a85565', border: '#f8a6b2', dot: 'rgba(248,166,178,0.18)', dot2: 'rgba(255,200,210,0.10)', bgSolid: '#fde0e4', textDark: '#a85565' },
    'app-blue':     { bg: '#e6ebfb', text: '#4a5ea8', border: '#889df0', dot: 'rgba(136,157,240,0.16)', dot2: 'rgba(136,157,240,0.10)', bgSolid: '#e0e7fa', textDark: '#4a5ea8' },
    'app-orange':   { bg: '#fde8df', text: '#a85540', border: '#e59266', dot: 'rgba(229,146,102,0.18)', dot2: 'rgba(229,146,102,0.10)', bgSolid: '#fce4da', textDark: '#a85540' },
};

function Card({ pattern, color, children, hoverable, style: extraStyle, ...rest }) {
    const pn = pattern || color || 'default';
    const c = CARD_COLORS[pn] || CARD_COLORS['default'];
    const hasPattern = pattern && pattern !== 'none';

    const bgStyle = hasPattern
        ? `radial-gradient(circle, ${c.dot} 1.5px, transparent 1.5px) 0 0/28px 28px,
           radial-gradient(circle, ${c.dot2} 1px, transparent 1px) 7px 7px/14px 14px,
           ${c.bgSolid}`
        : c.bg;

    return h('div', {
        style: {
            background: bgStyle,
            padding: '16px 24px',
            borderRadius: 20,
            color: c.text,
            fontWeight: 500,
            border: hasPattern ? `1.5px solid ${c.border}` : 'none',
            transition: 'all 0.3s cubic-bezier(0.4,0,0.2,1)',
            cursor: hoverable ? 'pointer' : undefined,
            ...(extraStyle || {}),
        },
        ...rest,
    }, children);
}

// ==================== TITLE COMPONENT (simplified ribbon) ====================
const TITLE_COLORS = {
    'app-teal':    { rf: '#82d5bb', rb: '#40a880', rk: '#186048', rt: '#fff' },
    'app-green':   { rf: '#8ac68a', rb: '#509050', rk: '#205020', rt: '#fff' },
    'app-yellow':  { rf: '#f7cd67', rb: '#d4a030', rk: '#8a6010', rt: '#725d42' },
    'app-pink':    { rf: '#f8a6b2', rb: '#e06880', rk: '#a03060', rt: '#fff' },
    'default-green': { rf: '#27d039', rb: '#20992a', rk: '#115017', rt: '#fff' },
};

function Title({ color = 'app-teal', size = 'large', children }) {

    const fs = sizeMap[size] || 28;
    const c = TITLE_COLORS[color] || TITLE_COLORS['app-teal'];

    return h('div', {
        style: {
            display: 'inline-flex',
            alignItems: 'center',
            position: 'relative',
            height: `${fs * 2}px`,
            padding: `0 ${fs * 1.6}px`,
            fontWeight: 800,
            lineHeight: 1,
            letterSpacing: '0.04em',
            filter: 'drop-shadow(0 2px 3px rgba(0,0,0,0.05))',
            zIndex: 3,
        }
    },
        // back tail left
        h('span', {
            style: {
                position: 'absolute',
                zIndex: 1,
                width: `${fs * 1.7}px`, height: `${fs * 1.7}px`,
                bottom: `${fs * -0.4}px`, left: 0,
                background: c.rb,
                clipPath: 'polygon(100% 0%, 100% 100%, 0% 100%, 30% 50%, 0% 0%)',
            }
        }),
        // back tail right
        h('span', {
            style: {
                position: 'absolute',
                zIndex: 1,
                width: `${fs * 1.7}px`, height: `${fs * 1.7}px`,
                bottom: `${fs * -0.4}px`, right: 0,
                background: c.rb,
                clipPath: 'polygon(0% 0%, 100% 0%, 70% 50%, 100% 100%, 0% 100%)',
            }
        }),
        // fold left
        h('span', {
            style: {
                position: 'absolute',
                zIndex: 2,
                top: `calc(100% - ${fs * 0.04}px)`, left: 0,
                width: 0, height: 0,
                borderStyle: 'solid',
                borderWidth: `0 ${fs * 0.95}px ${fs * 0.45}px 0`,
                borderColor: `transparent ${c.rk} transparent transparent`,
            }
        }),
        // fold right
        h('span', {
            style: {
                position: 'absolute',
                zIndex: 2,
                top: `calc(100% - ${fs * 0.04}px)`, right: 0,
                width: 0, height: 0,
                borderStyle: 'solid',
                borderWidth: `0 0 ${fs * 0.45}px ${fs * 0.95}px`,
                borderColor: `transparent transparent transparent ${c.rk}`,
            }
        }),
        // front face
        h('span', {
            style: {
                position: 'absolute',
                zIndex: 3,
                inset: `0 ${fs * 0.1}px`,
                background: c.rf,
                borderRadius: `${fs * 0.2}px`,
                boxShadow: `inset 0 ${fs * -0.06}px 0 rgba(0,0,0,0.05)`,
                transform: 'perspective(11.5em) rotateX(3deg)',
            }
        }),
        // text
        h('span', {
            style: {
                position: 'relative',
                zIndex: 4,
                fontWeight: 900,
                fontSize: fs,
                color: c.rt,
                paddingTop: `${fs * 0.11}px`,
            }
        }, children),
    );
}

// ==================== TAG COMPONENT ====================
const TAG_PALETTE = {
    'app-teal':     '#82d5bb',
    'app-green':    '#8ac68a',
    'app-yellow':   '#f7cd67',
    'app-pink':     '#f8a6b2',
    'app-orange':   '#e59266',
    'app-red':      '#fc736d',
    'app-blue':     '#889df0',
    'purple':       '#b77dee',
    'default':      'rgb(247,243,223)',
};

function Tag({ color = 'default', children, variant = 'solid', size = 'middle', style: extraStyle }) {
    const sizeMap = { small: { h: 24, px: 10, fs: 12 }, middle: { h: 29, px: 12, fs: 13 }, large: { h: 34, px: 16, fs: 15 } };
    const s = sizeMap[size] || sizeMap.middle;
    const c = TAG_PALETTE[color] || TAG_PALETTE['default'];
    const isDefault = color === 'default';

    return h('span', {
        style: {
            display: 'inline-flex', alignItems: 'center',
            height: s.h, padding: `0 ${s.px}px`,
            fontSize: `clamp(10px, 2.5vw, ${s.fs}px)`,
            fontWeight: 600,
            borderRadius: 999,
            border: `1.5px solid ${c}`,
            background: variant === 'solid' ? (isDefault ? 'rgb(247,243,223)' : c) : 'transparent',
            color: variant === 'solid' ? (isDefault ? '#8f734f' : '#fff') : c,
            lineHeight: `${s.h - 3}px`,
            transition: 'all 0.2s ease',
            flexShrink: 0,
            whiteSpace: 'nowrap',
            ...(extraStyle || {}),
        }
    }, children);
}

// ==================== PROGRESS COMPONENT ====================
function Progress({ percent = 0, size = 'middle', infoFormat, style: extraStyle }) {
    const sizeMap = { small: 12, middle: 20, large: 28 };
    const barH = sizeMap[size] || 20;
    const p = Math.min(100, Math.max(0, percent || 0));
    const text = infoFormat ? infoFormat(p) : `${Math.round(p)}%`;

    return h('div', {
        role: 'progressbar',
        'aria-valuemin': 0, 'aria-valuemax': 100, 'aria-valuenow': Math.round(p),
        style: {
            position: 'relative',
            width: '100%', height: barH,
            background: '#f8f8f0',
            border: `${size === 'small' ? 1.5 : 2}px solid #e8dcc8`,
            borderRadius: 999,
            overflow: 'hidden',
            boxShadow: 'inset 0 2px 4px rgba(114,93,66,0.08)',
            minWidth: 80,
            ...(extraStyle || {}),
        }
    },
        h('div', {
            style: {
                position: 'absolute', top: 0, left: 0, bottom: 0,
                width: `${p}%`,
                borderRadius: 999,
                background: '#0ec4b6',
                backgroundImage: 'repeating-linear-gradient(-45deg, #0ec4b6 0, #0ec4b6 10px, #01b0a7 10px, #01b0a7 20px)',
                backgroundSize: '28.28px 28.28px',
                animation: 'progressStripe 1s linear infinite',
                transition: 'width 0.6s cubic-bezier(0.4,0,0.2,1)',
            }
        }),
        h('span', {
            style: {
                position: 'absolute',
                right: 8, top: '50%',
                transform: 'translateY(-50%)',
                color: p < 18 ? '#725d42' : '#fff',
                fontWeight: 800,
                fontSize: size === 'small' ? 9 : size === 'large' ? 13 : 11,
                textShadow: p >= 18 ? '0 1px 1px rgba(0,0,0,0.15)' : 'none',
                zIndex: 1,
            }
        }, text),
    );
}

// ==================== APP COMPONENT ====================
function App() {
    const [accounts, setAccounts] = useState([]);
    const [allData, setAllData] = useState([]);
    const [selectedUser, setSelectedUser] = useState(null);
    const [running, setRunning] = useState(false);
    const [progress, setProgress] = useState({ done: 0, total: 0, current: '' });
    const [results, setResults] = useState([]);
    const [logLines, setLogLines] = useState([]);
    const [stats, setStats] = useState({ accounts: 0, balance: '—', checked: 0, streak: 0 });
    const [username, setUsername] = useState('');
    const [password, setPassword] = useState('');
    const [autoScroll, setAutoScroll] = useState(true);
    const [pollId, setPollId] = useState(null);
    const lastLogSigRef = useRef('');
    const logContentRef = useRef(null);

    // Load accounts
    const loadAccounts = useCallback(async () => {
        try {
            const list = await api('/api/accounts');
            setAccounts(list);
            setStats(s => ({ ...s, accounts: list.length }));
        } catch(e) { Notification.error('加载账号失败', e.message); }
    }, []);

    // Load summary stats
    const loadSummary = useCallback(async () => {
        try {
            const s = await api('/api/summary');
            setStats(prev => ({ ...prev, accounts: s.account_count }));
        } catch(e) {}
    }, []);

    // Load status (all data + global stats)
    const refreshStatus = useCallback(async () => {
        try {
            const data = await api('/api/status');
            setAllData(data);
            const accts = data.map(d => ({ username: d.username }));
            setAccounts(accts);
            let maxStreak = 0, totalBal = 0, checkedCount = 0;
            data.forEach(d => {
                if (d.continuous_days > maxStreak) maxStreak = d.continuous_days;
                if (d.checked_today) checkedCount++;
                const m = NUM_RE.exec(d.balance || '0');
                if (m) totalBal += parseFloat(m[0]);
            });
            setStats(s => ({ ...s, streak: maxStreak, balance: totalBal ? `¥${totalBal.toFixed(2)}` : '—', checked: checkedCount }));
        } catch(e) { Notification.error('状态查询失败', e.message); }
    }, []);

    // Load logs
    const loadLogs = useCallback(async () => {
        try {
            const data = await api('/api/logs');
            setLogLines(data.lines || []);
        } catch(e) {}
    }, []);

    // Add account
    const addAccount = useCallback(async () => {
        if (!username.trim() || !password.trim()) { Notification.warning('用户名和密码不能为空'); return; }
        try {
            await api('/api/accounts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username.trim(), password }),
            });
            Notification.success('账号已添加');
            setUsername(''); setPassword('');
            await refreshStatus();
        } catch(e) { Notification.error('添加失败', e.message); }
    }, [username, password, refreshStatus]);

    // Delete account
    const deleteAccount = useCallback(async (uname) => {
        if (!confirm(`确定删除账号「${uname}」吗？`)) return;
        try {
            await api(`/api/accounts/${encodeURIComponent(uname)}`, { method: 'DELETE' });
            Notification.success('账号已删除');
            if (selectedUser === uname) setSelectedUser(null);
            await refreshStatus();
        } catch(e) { Notification.error('删除失败', e.message); }
    }, [selectedUser, refreshStatus]);

    // Select account (toggle)
    const selectAccount = useCallback((username) => {
        if (selectedUser === username) {
            setSelectedUser(null);
        } else {
            setSelectedUser(username);
        }
    }, [selectedUser]);

    // Start checkin
    const startCheckin = useCallback(async () => {
        if (running) return;
        try {
            await api('/api/checkin', { method: 'POST' });
            setRunning(true);
            setResults([]);
            Notification.info('签到任务已启动');
        } catch(e) { Notification.error(e.message); }
    }, [running]);

    // Poll checkin status
    useEffect(() => {
        if (!running) {
            if (pollId) { clearInterval(pollId); setPollId(null); }
            return;
        }
        const id = setInterval(async () => {
            if (document.hidden) return;
            try {
                const st = await api('/api/checkin/status');
                setProgress(st.progress || { done: 0, total: 0, current: '' });
                setResults(st.results || []);
                setLogLines(st.log_lines || []);
                if (!st.running) {
                    setRunning(false);
                    const ok = (st.results || []).filter(r => r.success).length;
                    const total = (st.results || []).length;
                    Notification[ok === total ? 'success' : 'warning'](`签到完成：成功 ${ok} / ${total}`);
                    await refreshStatus();
                    await loadSummary();
                }
            } catch(e) { /* network jitter */ }
        }, 1500);
        setPollId(id);
        return () => clearInterval(id);
    }, [running]);

    // Initial load
    useEffect(() => {
        loadAccounts();
        loadSummary();
        loadLogs();
        refreshStatus();
        // Check for running checkin
        api('/api/checkin/status').then(st => {
            if (st.running) {
                setRunning(true);
                setProgress(st.progress || { done: 0, total: 0, current: '' });
                setResults(st.results || []);
                setLogLines(st.log_lines || []);
            }
        }).catch(() => {});
    }, []);

    // Auto-scroll log
    useEffect(() => {
        if (autoScroll && logContentRef.current) {
            logContentRef.current.scrollTop = logContentRef.current.scrollHeight;
        }
    }, [logLines, autoScroll]);

    // Format log lines
    const logHtml = logLines.map((line, i) => {
        const m = LOG_LINE_RE.exec(line);
        if (!m) return h('span', { key: i, className: 'log-line' }, escapeHtml(line));
        return h('span', { key: i, className: 'log-line' },
            h('span', { className: 'ts' }, escapeHtml(m[1])),
            ' [',
            h('span', { className: `lvl-${m[2].trim()}` }, m[2].trim()),
            '] ',
            escapeHtml(m[3]),
        );
    });

    // Clear logs
    const clearLogs = () => {
        setLogLines([]);
        lastLogSigRef.current = '';
        api('/api/logs', { method: 'POST' }).catch(() => {});
    };

    // Selected account detail
    const selData = allData.find(d => d.username === selectedUser);

    // Progress percent
    const progPct = progress.total ? Math.round((progress.done / progress.total) * 100) : 0;

    return h(Fragment, null,
        h('div', { className: 'page' },
            // Hero
            h('div', { className: 'hero-section' },
                h(Title, { color: 'app-teal', size: 'large' }, '幻城'),
                h('p', { className: 'hero-subtitle' }, '幻城中转站的签到小屋 · 守护你的每一缕额度'),
            ),

            // Stats row
            h('div', { className: 'stats-row' },
                h(Card, { pattern: 'app-teal' },
                    h('div', { className: 'stat-card-inner' },
                        h('span', { className: 'stat-icon-text' }, '📋'),
                        h('div', { className: 'stat-label' }, '账号总数'),
                        h('div', { className: 'stat-value' }, stats.accounts),
                    )
                ),
                h(Card, { pattern: 'app-green' },
                    h('div', { className: 'stat-card-inner' },
                        h('span', { className: 'stat-icon-text' }, '💰'),
                        h('div', { className: 'stat-label' }, '总余额'),
                        h('div', { className: 'stat-value' }, stats.balance),
                    )
                ),
                h(Card, { pattern: 'app-yellow' },
                    h('div', { className: 'stat-card-inner' },
                        h('span', { className: 'stat-icon-text' }, '✓'),
                        h('div', { className: 'stat-label' }, '今日签到'),
                        h('div', { className: 'stat-value' }, stats.checked),
                    )
                ),
                h(Card, { pattern: 'app-pink' },
                    h('div', { className: 'stat-card-inner' },
                        h('span', { className: 'stat-icon-text' }, '🔥'),
                        h('div', { className: 'stat-label' }, '最长连续'),
                        h('div', { className: 'stat-value' }, stats.streak, h('span', { className: 'stat-unit' }, ' 天')),
                    )
                ),
            ),

            // Action bar
            h('div', { className: 'action-bar' },
                h(Button, { type: 'primary', size: 'large', loading: running, onClick: startCheckin },
                    running ? '签到进行中' : '自动签到'
                ),
                h(Button, { type: 'primary', size: 'large', onClick: refreshStatus }, '刷新状态'),
            ),

            // Progress area
            running && h('div', { className: 'progress-area' },
                h(Card, { pattern: 'default' },
                    h(Progress, { percent: progPct, size: 'large', infoFormat: () => `${progress.done} / ${progress.total}` }),
                    h('div', { className: 'progress-meta-row' },
                        h('span', null, progress.current || '准备中…'),
                    ),
                    results.length > 0 && h('ul', { className: 'result-list' },
                        results.map((r, i) => {
                            let tagColor = 'app-red', tagText = '✕ 失败';
                            if (r.already_checked) { tagColor = 'app-yellow'; tagText = '已签到'; }
                            else if (r.success) { tagColor = 'app-green'; tagText = `+${r.quota_awarded}`; }
                            return h('li', { key: i },
                                h(Tag, { color: tagColor, size: 'small' },
                                    `${escapeHtml(r.username)} ${tagText}`
                                ),
                            );
                        })
                    ),
                ),
            ),

            // Dual layout
            h('div', { className: 'dual-layout' },
                // Left: account list
                h('div', { className: 'account-list-wrap' },
                    h(Card, { pattern: 'default' },
                        h('div', { style: { fontWeight: 700, color: 'var(--text)', marginBottom: 10, fontSize: 15 } },
                            `账号列表 · ${accounts.length} 个`
                        ),
                        accounts.length === 0
                            ? h('div', { className: 'empty-state-wrap' },
                                h('span', { className: 'big-icon' }, '👤'),
                                h('p', null, '尚无账号，请在下方添加'),
                            )
                            : accounts.map((a, i) => {
                                const d = allData[i] || {};
                                let dotCls = 'offline';
                                if (d.online) dotCls = d.checked_today ? 'online-checked' : 'online-unchecked';
                                const isActive = a.username === selectedUser;
                                return h('div', {
                                    key: i,
                                    className: 'account-item-row' + (isActive ? ' active' : ''),
                                    onClick: () => selectAccount(a.username),
                                },
                                    h('span', { className: 'ac-avatar-circle' }, escapeHtml(a.username.charAt(0).toUpperCase())),
                                    h('span', { className: 'ac-name-text' }, escapeHtml(a.username)),
                                    h('span', { className: `ac-dot ${dotCls}` }),
                                    h('button', {
                                        className: 'ac-delete-btn',
                                        onClick: (e) => { e.stopPropagation(); deleteAccount(a.username); },
                                        title: '删除账号',
                                    }, '×'),
                                );
                            })
                    ),
                ),
                // Right: detail
                h('div', { className: 'detail-panel-wrap' },
                    h(Card, { pattern: 'default' },
                        selData
                            ? h(Fragment, null,
                                h('div', { className: 'detail-head' },
                                    h('span', { className: 'detail-avatar-lg' }, escapeHtml(selData.username.charAt(0).toUpperCase())),
                                    h('span', { className: 'detail-name' }, escapeHtml(selData.username)),
                                    h(Tag, {
                                        color: !selData.online ? 'default' : selData.checked_today ? 'app-green' : 'app-yellow',
                                        size: 'small',
                                    }, !selData.online ? '× 离线' : selData.checked_today ? '✓ 已签到' : '○ 未签到'),
                                ),
                                h('div', { className: 'data-grid-2x2' },
                                    h('div', { className: 'data-cell' },
                                        h('div', { className: 'data-cell-label' }, '总余额'),
                                        h('div', { className: 'data-cell-val' }, escapeHtml(selData.balance || '—')),
                                    ),
                                    h('div', { className: 'data-cell' },
                                        h('div', { className: 'data-cell-label' }, '已用额度'),
                                        h('div', { className: 'data-cell-val' }, escapeHtml(selData.used || '—')),
                                    ),
                                    h('div', { className: 'data-cell' },
                                        h('div', { className: 'data-cell-label' }, '连续签到'),
                                        h('div', { className: 'data-cell-val' }, (selData.continuous_days || 0), h('span', { className: 'stat-unit' }, ' 天')),
                                    ),
                                    h('div', { className: 'data-cell' },
                                        h('div', { className: 'data-cell-label' }, '今日获得'),
                                        h('div', { className: 'data-cell-val' }, escapeHtml(selData.today_award || '—')),
                                    ),
                                ),
                                (() => {
                                    const um = NUM_RE.exec(selData.used || '0');
                                    const bm = NUM_RE.exec(selData.balance || '0');
                                    let qpct = 0;
                                    if (um && bm) {
                                        const u = parseFloat(um[0]), b = parseFloat(bm[0]);
                                        const s = u + b || 1;
                                        qpct = Math.round((u / s) * 100);
                                    }
                                    return h(Fragment, null,
                                        h('div', { className: 'section-label-sm' }, '额度使用情况'),
                                        h('div', { style: { display: 'flex', justifyContent: 'space-between', fontSize: 12, fontWeight: 600, color: 'var(--text-muted)', marginBottom: 4 } },
                                            h('span', null, '已用'),
                                            h('span', null, `${qpct}%`),
                                        ),
                                        h('div', { className: 'quota-bar-wrap' },
                                            h('div', { className: 'quota-bar-fill', style: { width: `${qpct}%` } }),
                                        ),
                                    );
                                })(),
                            )
                            : h('div', { className: 'empty-state-wrap' },
                                h('span', { className: 'big-icon' }, '👤'),
                                h('p', null, '从左侧选择一个账号查看详情'),
                            ),
                    ),
                ),
            ),

            // Add account form
            h('div', { style: { marginBottom: 24 } },
                h(Card, { pattern: 'default' },
                    h('div', { className: 'add-form-wrap' },
                        h('div', { className: 'field-col' },
                            h('div', { style: { fontSize: 13, fontWeight: 600, color: 'var(--text-muted)', marginBottom: 6 } }, '用户名'),
                            h(Input, { value: username, onChange: e => setUsername(e.target.value), placeholder: '输入幻城账号' }),
                        ),
                        h('div', { className: 'field-col' },
                            h('div', { style: { fontSize: 13, fontWeight: 600, color: 'var(--text-muted)', marginBottom: 6 } }, '密码'),
                            h(Input, { value: password, onChange: e => setPassword(e.target.value), type: 'password', placeholder: '输入密码' }),
                        ),
                        h(Button, { type: 'primary', size: 'middle', onClick: addAccount }, '添加账号'),
                    ),
                ),
            ),

            // Log terminal
            h(Card, { pattern: 'default' },
                h('div', { className: 'log-head-row' },
                    h('span', { className: 'log-title-text' }, '签到日志'),
                    h('div', { className: 'log-controls' },
                        h('label', { style: { display: 'flex', alignItems: 'center', gap: 6, fontSize: 13, fontWeight: 600, color: 'var(--text-muted)', cursor: 'pointer' } },
                            h('input', { type: 'checkbox', checked: autoScroll, onChange: e => setAutoScroll(e.target.checked), style: { accentColor: 'var(--primary)' } }),
                            '自动滚动',
                        ),
                        h(Button, { size: 'small', onClick: clearLogs }, '清屏'),
                    ),
                ),
                h('div', { className: 'log-terminal', ref: logContentRef },
                    h('div', { className: 'log-scanline' }),
                    logLines.length === 0
                        ? h('span', { style: { color: 'var(--text-muted)' } }, '等待日志输出…')
                        : logHtml,
                ),
            ),

            // Footer
            h('div', { className: 'page-footer' },
                h('span', null, '幻城网安 API 自动签到 · Web 控制台'),
                h('span', { style: { margin: '0 6px', opacity: 0.4 } }, '·'),
                h('a', { href: 'https://api.hcnsec.cn', target: '_blank', rel: 'noopener' }, 'api.hcnsec.cn'),
            ),
        ),
    );
}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));

// Animations injected via style
const animStyle = document.createElement('style');
animStyle.textContent = `
@keyframes btnStripe { to { background-position: -28.28px 0; } }
@keyframes progressStripe { to { background-position: -28.28px 0; } }
@keyframes notifSlideDown { from { opacity:0; transform:translateY(-12px); } to { opacity:1; transform:translateY(0); } }
@keyframes notifSlideUp { from { opacity:1; transform:translateY(0); } to { opacity:0; transform:translateY(-12px); } }
`;
document.head.appendChild(animStyle);
</script>
</body>
</html>
